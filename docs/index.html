<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Elastispec Walkthrough</title>
<meta name="description" content="A click-through of one Elastispec audit of a PaperCut instance, from vendor documents to compliance tree.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@100..125,500..800&family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: a switch-faceplate step rail on top, the explanation beside the real artifact, one Next button below. */
:root {
  --bg: #EDF0F2; --panel: #FFFFFF; --panel-2: #F5F7F8; --ink: #14202B; --muted: #52606C; --line: #D2D9DF;
  --accent: #0A5CA8; --accent-ink: #FFFFFF; --accent-soft: #DBE8F5;
  --plate: #1D2831; --plate-ink: #C7D2DA; --plate-line: #3A4853; --plate-port: #111920; --led-off: #44525D; --led-done: #41C483; --led-now: #F4B740;
  --valid: #11704A; --valid-bg: #DDF2E8; --conj: #8C5604; --conj-bg: #FAEDD2; --unsat: #AE251C; --unsat-bg: #FAE3E1; --pending: #66737F; --pending-bg: #E4E9ED;
  --code-bg: #F3F5F7; --hl: #FFEFB8; --hl-ink: #14202B; --hole: #24303A; --cell: #BFE6D2;
  --display: "Archivo", "Helvetica Neue", Arial, sans-serif;
  --body: "IBM Plex Sans", -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #11171C; --panel: #192127; --panel-2: #1F282F; --ink: #E5EBEF; --muted: #98A6B1; --line: #2F3A43;
    --accent: #71B4EE; --accent-ink: #0B1720; --accent-soft: #1F3547;
    --plate: #0C1216; --plate-ink: #B6C2CB; --plate-line: #2C3841; --plate-port: #060A0D; --led-off: #3A4751;
    --valid: #58CF98; --valid-bg: #143226; --conj: #EDB454; --conj-bg: #38290F; --unsat: #F58A82; --unsat-bg: #3D1C1A; --pending: #93A1AC; --pending-bg: #28323A;
    --code-bg: #141B20; --hl: #4A3D12; --hl-ink: #F7EBC6; --hole: #E5EBEF; --cell: #1E5A42;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #11171C; --panel: #192127; --panel-2: #1F282F; --ink: #E5EBEF; --muted: #98A6B1; --line: #2F3A43;
  --accent: #71B4EE; --accent-ink: #0B1720; --accent-soft: #1F3547;
  --plate: #0C1216; --plate-ink: #B6C2CB; --plate-line: #2C3841; --plate-port: #060A0D; --led-off: #3A4751;
  --valid: #58CF98; --valid-bg: #143226; --conj: #EDB454; --conj-bg: #38290F; --unsat: #F58A82; --unsat-bg: #3D1C1A; --pending: #93A1AC; --pending-bg: #28323A;
  --code-bg: #141B20; --hl: #4A3D12; --hl-ink: #F7EBC6; --hole: #E5EBEF; --cell: #1E5A42;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink); font: 15px/1.5 var(--body); margin: 0;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 10px 0;
}
a { color: var(--accent); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
code, pre, .mono { font-family: var(--mono); }
.app { display: flex; flex-direction: column; gap: 10px; max-width: 1480px; margin-inline: auto; }

/* Header */
.top { display: flex; flex-wrap: wrap; align-items: baseline; gap: 4px 14px; }
.brand { font: 800 21px/1.15 var(--display); letter-spacing: -0.01em; font-stretch: 112%; }
.tagline { color: var(--muted); font-size: 14px; min-width: 0; }
.legend { margin-left: auto; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

/* Verdict pills: colour plus a glyph, so the state survives without colour */
.pill {
  display: inline-flex; align-items: center; gap: 5px; font: 600 11.5px/1 var(--mono); padding: 4px 7px; border-radius: 4px;
  white-space: nowrap; border: 1px solid transparent;
}
.pill::before { font-size: 11px; line-height: 1; }
.pill.VALID { color: var(--valid); background: var(--valid-bg); }
.pill.VALID::before { content: "\2713"; }
.pill.CONJECTURED-SAT { color: var(--conj); background: var(--conj-bg); }
.pill.CONJECTURED-SAT::before { content: "?"; }
.pill.UNSAT { color: var(--unsat); background: var(--unsat-bg); }
.pill.UNSAT::before { content: "\2715"; }
.pill.PENDING { color: var(--pending); background: var(--pending-bg); }
.pill.PENDING::before { content: "\2026"; }
.pill.MATCHED { color: var(--valid); background: var(--valid-bg); }
.pill.OUT_OF_SPEC { color: var(--unsat); background: var(--unsat-bg); }
.pill.SHADOWED, .pill.UNAPPLIED, .pill.DENY { color: var(--pending); background: var(--pending-bg); }

/* Faceplate step rail */
.rail {
  background: var(--plate); color: var(--plate-ink); border-radius: 6px; padding: 7px 10px 8px;
  display: flex; gap: 16px; overflow-x: auto; scrollbar-width: thin;
}
.rail-group { display: flex; flex-direction: column; gap: 4px; flex: none; }
.rail-group + .rail-group { border-left: 1px solid var(--plate-line); padding-left: 16px; }
.rail-label { font: 600 10.5px/1 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; opacity: 0.8; }
.ports { display: flex; gap: 5px; }
.port {
  width: 34px; height: 30px; padding: 3px 0 0; background: var(--plate-port); border: 1px solid var(--plate-line); border-radius: 3px;
  color: var(--plate-ink); cursor: pointer; display: flex; flex-direction: column; align-items: center; gap: 2px;
  font: 600 11px/1 var(--mono); font-variant-numeric: tabular-nums;
}
.port .led { width: 12px; height: 4px; border-radius: 1px; background: var(--led-off); }
.port.done .led { background: var(--led-done); }
.port.now { border-color: var(--led-now); color: #FFFFFF; }
.port.now .led { background: var(--led-now); }
.port:hover { border-color: var(--plate-ink); }
.rail-title { margin-left: auto; align-self: center; font: 500 12.5px/1.25 var(--body); padding-left: 16px; text-align: right; flex: none; max-width: 240px; color: #FFFFFF; }

/* Stage */
.stage { display: grid; grid-template-columns: minmax(300px, 400px) minmax(0, 1fr); gap: 12px; min-height: 0; align-items: start; }
.narr { min-width: 0; padding: 4px 4px 8px 2px; }
.eyebrow { font: 600 11.5px/1.3 var(--mono); letter-spacing: 0.04em; color: var(--muted); text-transform: uppercase; }
.narr h1 { font: 750 25px/1.16 var(--display); font-stretch: 104%; letter-spacing: -0.012em; margin: 5px 0 9px; text-wrap: balance; }
.narr p { margin: 0 0 9px; max-width: 62ch; }
.narr ul { margin: 0 0 9px; padding-left: 18px; }
.narr li { margin-bottom: 4px; }
.narr code { font-size: 0.88em; background: var(--code-bg); padding: 1px 4px; border-radius: 3px; overflow-wrap: anywhere; }
.note {
  border-left: 3px solid var(--accent); background: var(--accent-soft); padding: 7px 10px; font-size: 13.5px; margin: 8px 0; border-radius: 0 4px 4px 0;
}
.note.warn { border-left-color: var(--conj); background: var(--conj-bg); }
.note code { background: transparent; padding: 0; }
.exhibit {
  min-width: 0; background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 12px; display: flex; flex-direction: column; gap: 10px;
}
.ex-label { font: 600 11.5px/1.3 var(--mono); color: var(--muted); display: flex; flex-wrap: wrap; gap: 4px 10px; align-items: center; justify-content: space-between; }
.ex-label b { color: var(--ink); font-weight: 600; }
.ex-block { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.source { font: 500 11px/1.3 var(--mono); color: var(--muted); }

/* Code */
.code {
  background: var(--code-bg); border: 1px solid var(--line); border-radius: 4px; margin: 0; padding: 8px 0; overflow: auto;
  font: 12.5px/1.5 var(--mono); max-height: 360px; min-width: 0;
}
.code .ln { display: block; padding: 0 10px; white-space: pre; min-height: 1.5em; }
.code .ln.hl { background: var(--hl); color: var(--hl-ink); }
.code .ln.dim { opacity: 0.5; }
.t-kw { color: var(--accent); font-weight: 600; }
.t-and { color: var(--valid); font-weight: 600; }
.t-or { color: var(--conj); font-weight: 600; }
.t-opt { color: var(--unsat); font-weight: 700; }
.t-def { font-weight: 600; }
.t-cm { color: var(--muted); }
.t-permit { color: var(--valid); font-weight: 600; }
.t-deny { color: var(--unsat); font-weight: 600; }
.ln.hl .t-kw, .ln.hl .t-and, .ln.hl .t-or, .ln.hl .t-opt, .ln.hl .t-permit, .ln.hl .t-deny, .ln.hl .t-cm { color: inherit; }
.code.tall { max-height: 460px; }

/* Topology and pipeline diagrams */
.dia { overflow-x: auto; }
.dia svg { display: block; width: 100%; min-width: 600px; max-width: 640px; height: auto; }
.dia.wide svg { max-width: 880px; }
.dia text { font-family: var(--mono); font-size: 12px; fill: var(--ink); }
.dia text.small { font-size: 10.5px; fill: var(--muted); }
.dia text.bold { font-weight: 600; }
.dia text.head { font-family: var(--body); font-size: 13px; font-weight: 600; }
.dia text.on { fill: var(--accent-ink); }
.dia .box { fill: var(--panel-2); stroke: var(--line); stroke-width: 1.2; }
.dia .box.on { fill: var(--accent); stroke: var(--accent); }
.dia .box.soft { fill: var(--accent-soft); stroke: var(--accent); }
.dia .fw { fill: var(--plate); stroke: var(--plate-line); }
.dia .fw-t { fill: #FFFFFF; font-weight: 600; }
.dia .link { stroke: var(--muted); stroke-width: 1.6; fill: none; }
.dia .arrowhead { fill: var(--muted); }
.dia .acl { fill: var(--panel); stroke: var(--unsat); stroke-width: 1; }
.dia .acl-t { font-size: 10.5px; fill: var(--unsat); }
.dia .host { fill: var(--panel); stroke: var(--muted); }
.dia .hole { fill: var(--hole); }
.dia .hot { stroke: var(--accent); stroke-width: 3; }
.dia .hot.flow { stroke-dasharray: 8 7; animation: flow 1s linear infinite; }
.dia .blocked { stroke: var(--unsat); stroke-width: 3; }
@keyframes flow { to { stroke-dashoffset: -30; } }

/* Tables */
.tbl-wrap { overflow-x: auto; border: 1px solid var(--line); border-radius: 4px; }
table.tbl { border-collapse: collapse; width: 100%; font-size: 13px; }
.tbl th { text-align: left; font: 600 11px/1.3 var(--mono); color: var(--muted); padding: 6px 8px; background: var(--panel-2); border-bottom: 1px solid var(--line); white-space: nowrap; }
.tbl td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
.tbl tr:last-child td { border-bottom: 0; }
.tbl td.mono, .tbl td code { font: 12px/1.4 var(--mono); }
.tbl tr.flag td { background: var(--unsat-bg); }
.tbl .nowrap { white-space: nowrap; }

/* Inventory groups */
.inv { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px; }
.inv-card { border: 1px solid var(--line); border-radius: 4px; padding: 9px 10px; background: var(--panel-2); min-width: 0; }
.inv-card h3 { margin: 0 0 2px; font: 700 14px/1.25 var(--display); }
.inv-card .tag { font: 600 11px/1.3 var(--mono); color: var(--muted); }
.inv-card ul { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 3px; }
.inv-card li { font: 12px/1.4 var(--mono); overflow-wrap: anywhere; }
.inv-card li span { color: var(--muted); }
.inv-card.unres { border: 1px dashed var(--conj); background: var(--conj-bg); }

/* Leaf board */
.board { border: 1px solid var(--line); border-radius: 4px; padding: 8px 9px; background: var(--panel-2); margin-top: 8px; }
.board-head { display: flex; justify-content: space-between; gap: 8px; font: 600 11.5px/1.3 var(--mono); color: var(--muted); margin-bottom: 6px; }
.board-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(22px, 1fr)); gap: 3px; }
.tile { aspect-ratio: 1; border-radius: 2px; border: 1px solid var(--line); background: var(--panel); padding: 0; cursor: pointer; font: 700 10px/1 var(--mono); max-width: 100%; }
.tile.VALID { background: var(--valid-bg); color: var(--valid); border-color: var(--valid); }
.tile.CONJECTURED-SAT { background: var(--conj-bg); color: var(--conj); border-color: var(--conj); }
.tile.UNSAT { background: var(--unsat-bg); color: var(--unsat); border-color: var(--unsat); }
.tile.now { outline: 2px solid var(--accent); outline-offset: 1px; }
.tile.sel { outline: 2px solid var(--ink); outline-offset: 1px; }
.board-detail { font: 12px/1.45 var(--mono); margin-top: 7px; min-height: 3.4em; overflow-wrap: anywhere; }
.board-detail .why { color: var(--muted); font-family: var(--body); display: block; margin-top: 2px; }

/* Leaf headline */
.leaf-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px 10px; font: 600 13.5px/1.35 var(--mono); padding: 8px 10px; background: var(--panel-2); border: 1px solid var(--line); border-radius: 4px; overflow-wrap: anywhere; }
.leaf-line .arrow { color: var(--muted); }
.leaf-line .unk { border-bottom: 2px dashed var(--conj); }
.leaf-line .push { margin-left: auto; }

/* Q and A cards */
.qa { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 8px; }
.qa-card { border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; background: var(--panel-2); min-width: 0; font-size: 13.5px; }
.qa-card .q { font-weight: 600; margin-bottom: 3px; }
.qa-card .a { font: 12px/1.45 var(--mono); overflow-wrap: anywhere; color: var(--muted); }
.qa-card .res { font: 600 13px/1.3 var(--mono); margin-bottom: 3px; }

/* /24 address maps */
.maps { display: flex; flex-wrap: wrap; gap: 16px; }
.map { flex: 0 1 auto; min-width: 0; }
.map h4 { margin: 0 0 4px; font: 600 12px/1.3 var(--mono); }
.map-grid { display: grid; grid-template-columns: repeat(16, 15px); gap: 1px; }
.cell { width: 15px; height: 15px; border: 0; padding: 0; background: var(--cell); border-radius: 1px; cursor: pointer; }
.cell.out { background: var(--hole); }
.cell.sel { outline: 2px solid var(--accent); outline-offset: 0; z-index: 1; position: relative; }
.map-note { font: 12px/1.45 var(--mono); min-height: 1.5em; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 3px 5px; }
.chip { font: 11.5px/1.5 var(--mono); padding: 0 5px; background: var(--code-bg); border: 1px solid var(--line); border-radius: 3px; }
.chip.hl { background: var(--hl); color: var(--hl-ink); border-color: var(--conj); }
.chip-key { display: inline-block; width: 10px; height: 10px; border-radius: 1px; vertical-align: -1px; margin-right: 3px; }

/* Compliance tree */
.tree { border: 1px solid var(--line); border-radius: 4px; overflow: auto; max-height: 460px; background: var(--panel-2); padding: 4px 0; }
.tr { display: flex; align-items: center; gap: 7px; padding: 2px 8px; font: 12.5px/1.4 var(--mono); min-width: max-content; }
.tr .tw { width: 14px; flex: none; color: var(--muted); background: none; border: 0; padding: 0; cursor: pointer; font-size: 11px; }
.tr .tw[disabled] { cursor: default; opacity: 0; }
.tr .op { font: 600 10.5px/1.5 var(--mono); padding: 0 4px; border-radius: 3px; background: var(--pending-bg); color: var(--ink); }
.tr .opt { color: var(--unsat); font-weight: 700; }
.tr.def > .nm { font-weight: 600; }
.tr.focus { background: var(--accent-soft); }
.tr.mark { background: var(--hl); color: var(--hl-ink); }
.tr.dim { opacity: 0.55; }
.tr .spacer { flex: 1 0 8px; }

/* Compare tiles */
.deltas { display: grid; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); gap: 8px; }
.delta { border: 1px solid var(--line); border-radius: 4px; padding: 8px 10px; background: var(--panel-2); min-width: 0; }
.delta .nm { font: 600 12px/1.4 var(--mono); overflow-wrap: anywhere; margin-bottom: 5px; }
.delta .change { display: flex; flex-wrap: wrap; gap: 5px; align-items: center; font-size: 12px; color: var(--muted); }

/* Metrics on the closing step */
.facts { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 8px; }
.fact { border-top: 2px solid var(--ink); padding-top: 5px; min-width: 0; }
.fact b { display: block; font: 750 25px/1.1 var(--display); font-variant-numeric: tabular-nums; }
.fact span { font-size: 12.5px; color: var(--muted); display: block; }
.cmd { display: flex; gap: 6px; align-items: flex-start; }
.cmd .code { flex: 1; }
.copy { font: 600 12px/1 var(--body); padding: 7px 10px; border: 1px solid var(--line); background: var(--panel); border-radius: 4px; cursor: pointer; flex: none; }
.copy:hover { border-color: var(--accent); }

/* Translator steps */
.stages { display: flex; flex-wrap: wrap; gap: 4px; align-items: center; }
.stage-chip { font: 600 12px/1.3 var(--mono); padding: 4px 8px; border: 1px solid var(--line); border-radius: 3px; background: var(--panel-2); color: var(--muted); }
.stage-chip.on { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
.stage-chip.past { color: var(--ink); }
.stage-sep { color: var(--muted); font-size: 12px; }

/* Controls */
.controls {
  position: sticky; bottom: 0; z-index: 5; background: var(--bg); padding-block: 8px calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex; gap: 10px; align-items: center; border-top: 1px solid var(--line);
}
.btn { font: 600 15px/1.2 var(--body); padding: 11px 16px; border-radius: 5px; border: 1px solid var(--line); background: var(--panel); cursor: pointer; }
.btn:disabled { opacity: 0.45; cursor: default; }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); flex: 1 1 auto; max-width: 560px; margin-left: auto; text-align: left; display: flex; justify-content: space-between; gap: 12px; }
.btn.primary .arw { font-family: var(--mono); }
.btn.primary:hover { filter: brightness(1.08); }
.pos { font: 600 12px/1.3 var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
.kbd-hint { font: 11.5px/1.3 var(--mono); color: var(--muted); }

.fade { animation: rise 0.22s ease-out; }
@keyframes rise { from { opacity: 0.55; transform: translateY(3px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) {
  .fade { animation: none; }
  .dia .hot.flow { animation: none; }
}

/* A one-screen layout on wide displays: the page never scrolls, each panel does. */
@media (min-width: 1000px) and (min-height: 640px) {
  html, body { height: 100%; }
  body { overflow: hidden; }
  .app { height: 100%; }
  .top, .rail, .controls { flex: none; }
  .stage { flex: 1 1 0; min-height: 0; align-items: stretch; }
  .narr, .exhibit { overflow-y: auto; min-height: 0; }
  .code { max-height: none; }
  .ex-block.grow { flex: 1 1 auto; min-height: 0; }
  .ex-block.grow > .code, .ex-block.grow > .tree { flex: 1 1 auto; min-height: 120px; max-height: none; }
  .tree { max-height: none; }
}
@media (max-width: 999px) {
  .stage { grid-template-columns: minmax(0, 1fr); }
  .tr .tw { order: -2; }
  .tr .pill { order: -1; }
  .tr .spacer { display: none; }
  .legend { margin-left: 0; }
  .rail-title { display: none; }
  .narr h1 { font-size: 22px; }
  .kbd-hint { display: none; }
}
@media (max-width: 480px) {
  .btn { padding: 11px 12px; font-size: 14px; }
  .pos { display: none; }
  .map-grid { grid-template-columns: repeat(16, 14px); }
  .cell { width: 14px; height: 14px; }
}

</style>
</head>
<body>
<div class="app">
  <header class="top">
    <div class="brand">Elastispec</div>
    <div class="tagline">Formalizing enterprise firewall management with informal and elastic specifications</div>
    <div class="legend" aria-label="Verification result legend"><span class="pill VALID">VALID</span><span class="pill CONJECTURED-SAT">CONJECTURED-SAT</span><span class="pill UNSAT">UNSAT</span></div>
  </header>
  <nav class="rail" id="rail" aria-label="Steps"></nav>
  <main class="stage">
    <section class="narr" id="narr" aria-live="polite"></section>
    <section class="exhibit" id="exhibit" aria-label="Recorded artifact for this step"></section>
  </main>
  <footer class="controls">
    <button class="btn" id="back">Back</button>
    <span class="pos" id="pos"></span>
    <span class="kbd-hint">Arrow keys also work</span>
    <button class="btn primary" id="next"><span id="next-label">Next</span><span class="arw" aria-hidden="true">&rarr;</span></button>
  </footer>
</div>

_Server, *) -> (Mobility_Print_Server, 53) on tcp, udp) AND\n    ((PaperCut_Clients, *) -> (Mobility_Print_Server, 9163) on tcp) AND\n    ((PaperCut_Clients, *) -> (Mobility_Print_Server, 9164) on tcp)\n\ndef MobilityPrintFirewallRules_CloudPrintPrinterDiscoverySpec as\n    ((Mobility_Print_Server, *) -> (Mobility_Print_Cloud_Services, 443) on tcp) AND\n    ((Mobility_Print_Server, *) -> (Twilio_STUN_TURN_Services, 3478) on tcp, udp) AND\n    ((Mobility_Print_Server, *) -> (Twilio_STUN_TURN_Services, 443, 3478) on tcp, udp)\n\ndef MobilityPrintFirewallRulesSpec as\n    MobilityPrintFirewallRules_Auto_updateSpec AND\n    (MobilityPrintFirewallRules_mDNSPrinterDiscoverySpec OR\n    MobilityPrintFirewallRules_KnownHostPrinterDiscoverySpec OR\n    MobilityPrintFirewallRules_DNSPrinterDiscoverySpec OR\n    MobilityPrintFirewallRules_CloudPrintPrinterDiscoverySpec)\n\ndef Multi_FunctionDeviceIntegration_HPSpec as\n    ((HP_Multi_Function_Device, *) -> (PaperCut_Application_Server, 9191) on tcp) AND\n    ((HP_Multi_Function_Device, *) -> (PaperCut_Application_Server, 9192) on tcp) AND\n    ((HP_Multi_Function_Device, *) -> (PaperCut_Application_Server, 9193) on tcp) AND\n    ((PaperCut_Application_Server, *) -> (HP_Multi_Function_Device, 7627) on tcp) AND\n    ((PaperCut_Application_Server, *) -> (HP_Multi_Function_Device, 80) on tcp) AND\n    ((PaperCut_Application_Server, *) -> (HP_Multi_Function_Device, 443) on tcp)\n\ndef Toshiba_SDK1_Spec as\n    (((Toshiba_Multi_Function_Device, *) -> (PaperCut_Application_Server, 9191) on tcp) OR\n    ((Toshiba_Multi_Function_Device, *) -> (PaperCut_Application_Server, 9192) on tcp)) AND\n    (((Toshiba_Multi_Function_Device, *) -> (PaperCut_Application_Server, 10389) on tcp) OR\n    ((Toshiba_Multi_Function_Device, *) -> (PaperCut_Application_Server, 10636) on tcp)) AND\n    (((Toshiba_Multi_Function_Device, *) -> (PaperCut_Application_Server, 162) on udp) AND\n    ((PaperCut_Application_Server, *) -> (Toshiba_Multi_Function_Device, 161) on udp))\n\ndef Toshiba_SDK2_Spec as\n    (((Toshiba_Multi_Function_Device, *) -> (PaperCut_Application_Server, 9191) on tcp) OR\n    ((Toshiba_Multi_Function_Device, *) -> (PaperCut_Application_Server, 9192) on tcp)) AND\n    (((Toshiba_Multi_Function_Device, *) -> (PaperCut_Application_Server, 10389) on tcp) OR\n    ((Toshiba_Multi_Function_Device, *) -> (PaperCut_Application_Server, 10636) on tcp)) AND\n    (((PaperCut_Application_Server, *) -> (Toshiba_Multi_Function_Device, 49629) on tcp) OR\n    ((PaperCut_Application_Server, *) -> (Toshiba_Multi_Function_Device, 49630) on tcp))\n\ndef Toshiba_SDK3_RD30_Spec as\n    (((Toshiba_Multi_Function_Device, *) -> (PaperCut_Application_Server, 9191) on tcp) OR\n    ((Toshiba_Multi_Function_Device, *) -> (PaperCut_Application_Server, 9192) on tcp)) AND\n    (((PaperCut_Application_Server, *) -> (Toshiba_Multi_Function_Device, 49629) on tcp) OR\n    ((PaperCut_Application_Server, *) -> (Toshiba_Multi_Function_Device, 49630) on tcp)) AND\n    ((PaperCut_Application_Server, *) -> (Toshiba_Multi_Function_Device, 50083) on tcp)\n\ndef Multi_FunctionDeviceIntegration_Toshiba_SDK_Choice_Spec as\n    (Toshiba_SDK1_Spec OR Toshiba_SDK2_Spec OR Toshiba_SDK3_RD30_Spec)\n\ndef Multi_FunctionDeviceIntegrationSpec as\n    Multi_FunctionDeviceIntegration_HPSpec OR\n    Multi_FunctionDeviceIntegration_Toshiba_SDK_Choice_Spec\n\ndef PaperCutToyFirewallSpec as\n    MobilityPrintFirewallRulesSpec AND\n    Multi_FunctionDeviceIntegrationSpec AND\n    ExternalDatabaseSpec AND\n    CardReadersSpec?\n","root":"PaperCutToyFirewallSpec","defs":["ExternalDatabaseSpec","MobilityPrintFirewallRules_Auto_updateSpec","MobilityPrintFirewallRules_mDNSPrinterDiscoverySpec","MobilityPrintFirewallRules_KnownHostPrinterDiscoverySpec","MobilityPrintFirewallRules_DNSPrinterDiscoverySpec","MobilityPrintFirewallRules_CloudPrintPrinterDiscoverySpec","MobilityPrintFirewallRulesSpec","Multi_FunctionDeviceIntegration_HPSpec","Toshiba_SDK1_Spec","Toshiba_SDK2_Spec","Toshiba_SDK3_RD30_Spec","Multi_FunctionDeviceIntegration_Toshiba_SDK_Choice_Spec","Multi_FunctionDeviceIntegrationSpec","PaperCutToyFirewallSpec"],"meta":{"commit":"9239544","batfishImage":"qing0/elastispec-batfish:sigcomm2026","pybatfish":"2025.07.07.2423"},"scenarios":{"ios":{"configName":"toy_firewall_config.txt","config":"hostname toy-papercut-fw\n!\n! ============================================================================\n! Toy firewall configuration for the Elastispec Auditor tutorial.\n! Standard Cisco IOS: the config is self-contained (interfaces, ACLs, and\n! bindings are all defined here), so build_snapshot.py copies it verbatim.\n!\n! Topology:\n!   10.10.20.0/24   ECE client subnet (campus)          - Gi0/0\n!   10.10.30.0/24   CS client subnet (campus)           - Gi0/1\n!   172.16.10.0/24  Server subnet                       - Gi0/2\n!                     172.16.10.2-.3 = two-node server pool; each node runs\n!                                      both the PaperCut Application Server\n!                                      and the Mobility Print Server\n!   172.16.20.0/24  Data-center subnet                  - Gi0/3\n!                     172.16.20.40 = PostgreSQL database\n!   203.0.113.0/24  External-services test network      - Gi0/4\n!\n! Security policy:\n! - Client and web interfaces carry no ACLs at all (campus traffic is\n!   unrestricted, nothing is filtered toward campus or web).\n! - The two protected interfaces (servers, data center) each carry an ACL\n!   pair:\n!     \"out\" governs traffic INTO the zone: destination-side enforcement,\n!           everything not explicitly permitted is dropped;\n!     \"in\"  governs the zone's own OUTBOUND traffic: permit ip any any\n!           (allow-all outbound).\n! ============================================================================\n!\ninterface GigabitEthernet0/0\n description ECE client subnet (campus)\n ip address 10.10.20.1 255.255.255.0\n!\ninterface GigabitEthernet0/1\n description CS client subnet (campus)\n ip address 10.10.30.1 255.255.255.0\n!\ninterface GigabitEthernet0/2\n description Server subnet (PaperCut app + Mobility Print pool at .2-.3)\n ip address 172.16.10.1 255.255.255.0\n ip access-group TO-SERVERS out\n ip access-group SERVERS-OUTBOUND in\n!\ninterface GigabitEthernet0/3\n description Data-center subnet (PostgreSQL at .40)\n ip address 172.16.20.1 255.255.255.0\n ip access-group TO-DATACENTER out\n ip access-group DATACENTER-OUTBOUND in\n!\ninterface GigabitEthernet0/4\n description External-services test network\n ip address 203.0.113.1 255.255.255.0\n!\n! What may reach the servers. The server pool is 172.16.10.2-.3 (wildcard\n! 172.16.10.2 0.0.0.1). One quarantined ECE client (10.10.20.66) is denied\n! everything first. Then campus (10.0.0.0/8) sources may use the embedded\n! MFD integration ports (9191/9192/9193/10389 + SNMP trap 162) and the\n! Mobility Print printing ports (9163/9164). udp/5353 (mDNS) and tcp+udp/53\n! (DNS) are deliberately NOT opened, so those printer-discovery options\n! cannot be satisfied. Everything else hits the implicit deny.\nip access-list extended TO-SERVERS\n deny ip host 10.10.20.66 172.16.10.2 0.0.0.1\n permit tcp 10.0.0.0 0.255.255.255 172.16.10.2 0.0.0.1 eq 9191\n permit tcp 10.0.0.0 0.255.255.255 172.16.10.2 0.0.0.1 eq 9192\n permit tcp 10.0.0.0 0.255.255.255 172.16.10.2 0.0.0.1 eq 9193\n permit tcp 10.0.0.0 0.255.255.255 172.16.10.2 0.0.0.1 eq 10389\n permit udp 10.0.0.0 0.255.255.255 172.16.10.2 0.0.0.1 eq 162\n permit tcp 10.0.0.0 0.255.255.255 172.16.10.2 0.0.0.1 eq 9163\n permit tcp 10.0.0.0 0.255.255.255 172.16.10.2 0.0.0.1 eq 9164\n!\n! Only the application-server subnet may reach the PostgreSQL database.\nip access-list extended TO-DATACENTER\n permit tcp 172.16.10.0 0.0.0.255 host 172.16.20.40 eq 5432\n!\n! The protected zones' own outbound traffic: allow-all.\nip access-list extended SERVERS-OUTBOUND\n permit ip any any\n!\nip access-list extended DATACENTER-OUTBOUND\n permit ip any any\n!\nend\n","tree":{"state":"CONJECTURED-SAT","effective":"CONJECTURED-SAT","optional":false,"name":"PaperCutToyFirewallSpec","kind":"def","op":"AND","children":[{"state":"VALID","effective":"VALID","optional":false,"name":"MobilityPrintFirewallRulesSpec","kind":"def","op":"AND","children":[{"state":"VALID","effective":"VALID","optional":false,"name":"MobilityPrintFirewallRules_Auto_updateSpec","kind":"def","op":"AND","children":[{"state":"VALID","effective":"VALID","optional":false,"kind":"leaf","text":"((Mobility_Print_Server, *) -> (Mobility_Print_Update_Services, 443) on tcp)","parts":{"src":"Mobility_Print_Server","dst":"Mobility_Print_Update_Services","port":"443","proto":"tcp"}},{"state":"VALID","effective":"VALID","optional":false,"kind":"leaf","text":"((Mobility_Print_Server, *) -> (PaperCut_Content_Delivery_Network, 443) on tcp)","parts":{"src":"Mobility_Print_Server","dst":"PaperCut_Content_Delivery_Network","port":"443","proto":"tcp"}}]},{"state":"VALID","effective":"VALID","optional":false,"kind":"op","op":"OR","children":[{"state":"UNSAT","effective":"UNSAT","optional":false,"name":"MobilityPrintFirewallRules_mDNSPrinterDiscoverySpec","kind":"def","op":"AND","children":[{"state":"UNSAT","effective":"UNSAT","optional":false,"kind":"leaf","text":"((PaperCut_Clients, *) -> (Mobility_Print_Server, 5353) on udp)","parts":{"src":"PaperCut_Clients","dst":"Mobility_Print_Server","port":"5353","proto":"udp"}},{"state":"CONJECTURED-SAT","effective":"CONJECTURED-SAT","optional":false,"kind":"leaf","text":"((PaperCut_Clients, *) -> (Mobility_Print_Server, 9164) on tcp)","parts":{"src":"PaperCut_Clients","dst":"Mobility_Print_Server","port":"9164","proto":"tcp"}},{"state":"CONJECTURED-SAT","effective":"CONJECTURED-SAT","optional":false,"kind":"leaf","text":"((PaperCut_Clients, *) -> (Mobility_Print_Server, 9163) on tcp)","parts":{"src":"PaperCut_Clients","dst":"Mobility_Print_Server","port":"9163","proto":"tcp"}}]},{"state":"CONJECTURED-SAT" erdicts as the IOS twin,\n! since the extra port opens traffic no leaf asks about. Interface labels in\n! reachability/conjecture output use nameif names such as \"ece\" rather than\n! \"GigabitEthernet0/0\". The extra port surfaces in the out-of-spec table.\n! ============================================================================\n!\nsame-security-traffic permit inter-interface\n!\ninterface GigabitEthernet0/0\n nameif ece\n security-level 100\n ip address 10.10.20.1 255.255.255.0\n!\ninterface GigabitEthernet0/1\n nameif cs\n security-level 100\n ip address 10.10.30.1 255.255.255.0\n!\ninterface GigabitEthernet0/2\n nameif servers\n security-level 100\n ip address 172.16.10.1 255.255.255.0\n!\ninterface GigabitEthernet0/3\n nameif datacenter\n security-level 100\n ip address 172.16.20.1 255.255.255.0\n!\ninterface GigabitEthernet0/4\n nameif web\n security-level 100\n ip address 203.0.113.1 255.255.255.0\n!\nobject-group network CAMPUS\n network-object 10.0.0.0 255.0.0.0\n!\nobject-group network SERVER_POOL\n network-object host 172.16.10.2\n network-object host 172.16.10.3\n!\nobject-group network QUARANTINED_CLIENTS\n network-object host 10.10.20.66\n!\nobject-group network SERVER_SUBNET\n network-object 172.16.10.0 255.255.255.0\n!\nobject-group network PG_DATABASE\n network-object host 172.16.20.40\n!\n! tcp/5114 is a legacy port no vendor document justifies. It sits in the same\n! object-group as four documented ports, so the ACL line that references the\n! group is still fully justified as a line; only a per-port check reports it.\nobject-group service MFD_INTEGRATION_PORTS\n service-object tcp destination eq 9191\n service-object tcp destination eq 9192\n service-object tcp destination eq 9193\n service-object tcp destination eq 10389\n service-object tcp destination eq 5114\n!\nobject-group service SNMP_TRAP\n service-object udp destination eq 162\n!\nobject-group service MOBILITY_PRINT_PORTS\n service-object tcp destination eq 9163\n service-object tcp destination eq 9164\n!\nobject-group service POSTGRES\n service-object tcp destination eq 5432\n!\n! What may reach the server pool: quarantine first, then campus sources on\n! the embedded-MFD integration ports and the Mobility Print printing ports.\n! udp/5353 (mDNS) and tcp+udp/53 (DNS) are deliberately NOT opened.\naccess-list TO-SERVERS extended deny ip object-group QUARANTINED_CLIENTS object-group SERVER_POOL\naccess-list TO-SERVERS extended permit object-group MFD_INTEGRATION_PORTS object-group CAMPUS object-group SERVER_POOL\naccess-list TO-SERVERS extended permit object-group SNMP_TRAP object-group CAMPUS object-group SERVER_POOL\naccess-list TO-SERVERS extended permit object-group MOBILITY_PRINT_PORTS object-group CAMPUS object-group SERVER_POOL\n!\n! Only the application-server subnet may reach the PostgreSQL database.\naccess-list TO-DATACENTER extended permit object-group POSTGRES object-group SERVER_SUBNET object-group PG_DATABASE\n!\n! The protected zones' own outbound traffic: allow-all.\naccess-list SERVERS-OUTBOUND extended permit ip any any\naccess-list DATACENTER-OUTBOUND extended permit ip any any\n!\naccess-group TO-SERVERS out interface servers\naccess-group SERVERS-OUTBOUND in interface servers\naccess-group TO-DATACENTER out interface datacenter\naccess-group DATACENTER-OUTBOUND in interface datacenter\n!\n","tree":{"state":"CONJECTURED-SAT","effective":"CONJECTURED-SAT","optional":false,"name":"PaperCutToyFirewallSpec","kind":"def","op":"AND","children":[{"state":"VALID","effective":"VALID","optional":false,"name":"MobilityPrintFirewallRulesSpec","kind":"def","op":"AND","children":[{"state":"VALID","effective":"VALID","optional":false,"name":"MobilityPrintFirewallRules_Auto_updateSpec","kind":"def","op":"AND","children":[{"state":"VALID","effective":"VALID","optional":false,"kind":"leaf","text":"((Mobility_Print_Server, *) -> (Mobility_Print_Update_Services, 443) on tcp)","parts":{"src":"Mobility_Print_Server","dst":"Mobility_Print_Upda <script>
/* Recorded data and small rendering helpers. Nothing here computes a verdict: verdicts come from the run. */
const D = JSON.parse(document.getElementById('demo-data').textContent);
const IOS = D.scenarios.ios, ASA = D.scenarios.asa, MISS = D.scenarios.missing_postgresql;

const esc = (s) => String(s == null ? '' : s).replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const pill = (state, label) => `<span class="pill ${esc(state)}">${esc(label || state)}</span>`;

/* ---- Syntax colouring, one regex pass per line so replacements never nest ---- */
function hlFsl(line) {
  return esc(line).replace(/\b(def|as)\b|\b(AND)\b|\b(OR)\b|(\?)/g, (m, kw, a, o, q) =>
    kw ? `<span class="t-kw">${m}</span>` : a ? `<span class="t-and">${m}</span>` : o ? `<span class="t-or">${m}</span>` : `<span class="t-opt">${m}</span>`);
}
function hlCisco(line) {
  if (/^\s*!/.test(line)) return `<span class="t-cm">${esc(line)}</span>`;
  return esc(line).replace(/\b(permit)\b|\b(deny)\b|\b(interface|hostname|ip access-list extended|ip access-group|access-list|access-group|object-group|nameif|service-object|network-object)\b/g,
    (m, p, d) => p ? `<span class="t-permit">${m}</span>` : d ? `<span class="t-deny">${m}</span>` : `<span class="t-kw">${m}</span>`);
}
function hlPy(line) {
  if (/^\s*#/.test(line)) return `<span class="t-cm">${esc(line)}</span>`;
  return esc(line).replace(/(&quot;.*?&quot;)|\b(True|False|None)\b/g, (m) => `<span class="t-kw">${m}</span>`);
}
const hlPlain = (line) => esc(line);
const HL = { fsl: hlFsl, cisco: hlCisco, py: hlPy, plain: hlPlain };

/* lines: text. opts.hl / opts.dim: predicate(lineText, index). */
function code(text, opts = {}) {
  const fn = HL[opts.lang || 'plain'];
  const rows = String(text).replace(/\n$/, '').split('\n').map((ln, i) => {
    const cls = ['ln'];
    if (opts.hl && opts.hl(ln, i)) cls.push('hl');
    if (opts.dim && opts.dim(ln, i)) cls.push('dim');
    return `<span class="${cls.join(' ')}">${fn(ln) || ' '}</span>`;
  });
  return `<pre class="code${opts.tall ? ' tall' : ''}" tabindex="0">${rows.join('')}</pre>`;
}
const block = (label, inner, opts = {}) =>
  `<div class="ex-block${opts.grow ? ' grow' : ''}"><div class="ex-label"><b>${label}</b>${opts.src ? `<span>${esc(opts.src)}</span>` : ''}</div>${inner}</div>`;

/* ---- Inventory helpers ---- */
function roleKind(role) {
  const rec = D.inventory[role];
  if (!rec || !rec.host_ip) return 'unresolved';
  const low = rec.host_ip.map((x) => String(x).toLowerCase());
  if (low.length === 1 && low[0] === 'n/a') return 'absent';
  if (low.length === 1 && low[0] === 'web') return 'web';
  return 'mapped';
}
function leafCategory(row) {
  const s = roleKind(row.parts.src), d = roleKind(row.parts.dst);
  if (s === 'absent' || d === 'absent') return 'absent';
  // A role the audit gave a stand-in address is treated as resolved in both directions.
  if (IOS.dstConjectures[row.parts.src] || IOS.dstConjectures[row.parts.dst]) return 'dst';
  if (s === 'unresolved') return row.verdict === 'UNSAT' ? 'srcClosed' : 'srcOpen';
  return 'known';
}
const CAT_ORDER = ['known', 'absent', 'srcOpen', 'srcClosed', 'dst'];
const cleanComment = (c) => String(c || '').replace(/^#\s*/, '');
const LEAVES = IOS.summary.map((r) => Object.assign({ cat: leafCategory(r) }, r, { comment: cleanComment(r.comment) }));
const leafBy = (s) => LEAVES.find((r) => r.leaf === s);
const countCat = (c) => LEAVES.filter((r) => r.cat === c).length;
const prettyLeaf = (p) => `${p.src} → ${p.dst} ${p.proto.toUpperCase()}/${p.port}`;

function leafHead(row, tags = {}) {
  const p = row.parts;
  const u = (role) => (roleKind(role) === 'unresolved' ? ' class="unk" title="Unresolved entity"' : '');
  return `<div class="leaf-line"><span${u(p.src)}>${esc(p.src)}</span><span class="arrow">→</span><span${u(p.dst)}>${esc(p.dst)}</span><span>${esc(p.proto.toUpperCase())}/${esc(p.port)}</span><span class="push">${tags.pending ? pill('PENDING', 'verifying') : pill(row.verdict)}</span></div>`;
}

/* ---- Leaf board: all leaf-level policies, filled in as the walkthrough reaches them ---- */
function board(reveal, nowLeaf) {
  const show = new Set(reveal);
  const ordered = [...LEAVES].sort((a, b) => CAT_ORDER.indexOf(a.cat) - CAT_ORDER.indexOf(b.cat));
  const done = ordered.filter((r) => show.has(r.cat)).length;
  const tiles = ordered.map((r) => {
    const on = show.has(r.cat);
    const cls = ['tile'];
    if (on) cls.push(r.verdict);
    if (nowLeaf && r.leaf === nowLeaf) cls.push('now');
    const mark = on ? ({ VALID: '✓', 'CONJECTURED-SAT': '?', UNSAT: '✕' }[r.verdict]) : '';
    return `<button class="${cls.join(' ')}" data-leaf="${esc(r.leaf)}" data-on="${on ? 1 : 0}" aria-label="${esc(prettyLeaf(r.parts))}${on ? ', ' + r.verdict : ', not verified yet'}">${mark}</button>`;
  });
  return `<div class="board" id="board"><div class="board-head"><span>Leaf-level policies</span><span>${done} of ${ordered.length} verified</span></div><div class="board-grid">${tiles.join('')}</div><div class="board-detail" id="board-detail">Select a square to see that leaf.</div></div>`;
}
function wireBoard() {
  const el = document.getElementById('board');
  if (!el) return;
  el.addEventListener('click', (e) => {
    const t = e.target.closest('.tile');
    if (!t) return;
    el.querySelectorAll('.tile.sel').forEach((x) => x.classList.remove('sel'));
    t.classList.add('sel');
    const r = leafBy(t.dataset.leaf);
    const det = document.getElementById('board-detail');
    det.innerHTML = t.dataset.on === '1'
      ? `${esc(prettyLeaf(r.parts))} ${pill(r.verdict)}${r.comment ? `<span class="why">${esc(humanComment(r))}</span>` : ''}`
      : `${esc(prettyLeaf(r.parts))}<span class="why">Not verified yet at this step.</span>`;
  });
}
function humanComment(r) {
  const c = r.comment || '';
  if (/^see .*conjectures_detail/.test(c)) return `Satisfied under the conjecture for ${r.parts.src}.`;
  const m = /^destination conjecture: (\S+)=(\S+)/.exec(c);
  if (m) return `Satisfied under the witness mapping ${m[1]} = ${m[2]}.`;
  return c;
}

/* ---- Topology of the toy firewall (from the config's own header comment) ---- */
function topology(opts = {}) {

  return `<div class="dia"><svg viewBox="0 0 760 318" role="img" aria-label="Firewall topology: two campus client subnets, a server subnet, a data-center subnet and an external test network, all attached to one firewall">

    ${link('l-cs', 'M178 186 H300 V168 H330')}
    ${link('l-srv', 'M450 128 H500 V62 H560')}
    ${link('l-dc', 'M450 168 H500 V210 H560')}
    ${link('l-web', 'M390 190 V270')}
    <rect class="fw" x="330" y="108" width="120" height="82" rx="4"/>
    <text class="fw-t" x="390" y="144" text-anchor="middle">toy-papercut</text><text class="fw-t" x="390" y="160" text-anchor="middle">-fw</text>

    <rect class="box" x="10" y="30" width="168" height="64" rx="4"/>

    <text class="small" x="20" y="83">denied by ACL: 10.10.20.66</text>
    <rect class="box" x="10" y="154" width="168" height="64" rx="4"/>
    <text class="head" x="20" y="174">CS clients</text><text x="20" y="191">10.10.30.0/24</text>
    <text class="small" x="20" y="207">no ACL on this interface</text>

    <rect class="box" x="560" y="24" width="190" height="78" rx="4"/>
    <text class="head" x="570" y="44">Server subnet</text><text x="570" y="61">172.16.10.0/24</text>
    <text class="small" x="570" y="77">.2 and .3 run PaperCut</text><text class="small" x="570" y="91">and Mobility Print</text>
    <rect class="box" x="560" y="172" width="190" height="66" rx="4"/>
    <text class="head" x="570" y="192">Data center</text><text x="570" y="209">172.16.20.0/24</text>
    <text class="small" x="570" y="225">.40 runs PostgreSQL</text>
    <rect class="box" x="290" y="270" width="200" height="42" rx="4"/>
    <text class="head" x="300" y="287">External test network</text><text class="small" x="300" y="303">203.0.113.0/24</text>

    <text class="small" x="184" y="56">${lbl('Gi0/0', 'ece')}</text>
    <text class="small" x="184" y="180">${lbl('Gi0/1', 'cs')}</text>

    <text class="small" x="456" y="184">${lbl('Gi0/3', 'datacenter')}</text>
    <text class="small" x="396" y="214">${lbl('Gi0/4', 'web')}</text>

    <rect class="acl" x="462" y="74" width="92" height="20" rx="3"/><text class="acl-t" x="508" y="88" text-anchor="middle">TO-SERVERS</text>
    <rect class="acl" x="462" y="218" width="92" height="20" rx="3"/><text class="acl-t" x="508" y="232" text-anchor="middle">TO-DATACENTER</text>
  </svg></div>`;
}

/* ---- Pipeline overview: each box jumps to its step ---- */
function pipeline() {
  const box = (x, y, w, h, title, sub, step, cls = '') => `<g class="go" data-go="${step}" role="link" tabindex="0" style="cursor:pointer" aria-label="Go to ${esc(title)} step">
    <rect class="box ${cls}" x="${x}" y="${y}" width="${w}" height="${h}" rx="4"/>
    <text class="head${cls === 'on' ? ' on' : ''}" x="${x + w / 2}" y="${y + h / 2 - 3}" text-anchor="middle">${esc(title)}</text>
    <text class="small${cls === 'on' ? ' on' : ''}" x="${x + w / 2}" y="${y + h / 2 + 13}" text-anchor="middle">${esc(sub)}</text></g>`;

    <defs><marker id="ah" viewBox="0 0 8 8" refX="7" refY="4" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path class="arrowhead" d="M0 0L8 4L0 8z"/></marker></defs>
    ${arr('M172 42 H222')}${arr('M372 42 H424')}${arr('M494 70 V116')}
    ${arr('M172 146 H424')}${arr('M172 216 H300 V176 H424')}${arr('M564 136 H620')}${arr('M564 176 C590 176 596 214 620 214')}
    ${box(10, 14, 162, 56, 'Vendor documents', 'natural language', 'translator')}
    ${box(222, 14, 150, 56, 'Translator', 'multi-step LLM agent', 'translator', 'soft')}
    ${box(424, 14, 140, 56, 'Specification', 'operator-inspected', 'spec')}
    ${box(10, 118, 162, 56, 'Firewall configuration', 'Cisco IOS or ASA', 'firewall')}
    ${box(10, 188, 162, 56, 'Entity mapping', 'may be partial', 'inventory')}
    ${box(424, 116, 140, 80, 'Auditor', 'Batfish as oracle', 'load', 'on')}
    ${box(620, 108, 150, 56, 'Compliance tree', 'a result per policy', 'tree')}
    ${box(620, 186, 150, 56, 'Out-of-spec flows', 'not in the document', 'outofspec')}
  </svg></div>`;
}

/* ---- /24 address maps drawn from Batfish's exact CIDR cover ---- */
const ipToInt = (ip) => ip.split('.').reduce((a, o) => a * 256 + Number(o), 0);
function inCover(ipInt, prefixes) {
  for (const p of prefixes) {
    const [base, len] = p.split('/');
    const size = Math.pow(2, 32 - Number(len || 32));
    const b = ipToInt(base);
    if (ipInt >= b && ipInt < b + size) return p;
  }
  return null;
}
function addressMap(title, net24, prefixes, id) {
  const base = ipToInt(net24 + '.0');
  const cells = [];
  for (let i = 0; i < 256; i++) {
    const cover = inCover(base + i, prefixes);
    cells.push(`<button class="cell${cover ? '' : ' out'}" data-ip="${net24}.${i}" data-p="${cover || ''}" aria-label="${net24}.${i} ${cover ? 'can reach, in ' + cover : 'cannot reach'}"></button>`);
  }
  return `<div class="map" id="${id}"><h4>${esc(title)}</h4><div class="map-grid">${cells.join('')}</div></div>`;
}
function wireMaps(noteId) {
  document.querySelectorAll('.map').forEach((m) => m.addEventListener('click', (e) => {
    const c = e.target.closest('.cell');
    if (!c) return;
    document.querySelectorAll('.cell.sel').forEach((x) => x.classList.remove('sel'));
    c.classList.add('sel');
    const n = document.getElementById(noteId);
    if (n) n.textContent = c.dataset.p ? `${c.dataset.ip} can reach the server. Covered by prefix ${c.dataset.p}.` : `${c.dataset.ip} cannot reach the server.`;
  }));
}

/* ---- Compliance tree ---- */
function annotateTree(root) {
  let n = 0;
  const walk = (node, depth, top) => {
    node.id = 't' + n++;
    node.depth = depth;
    node.top = top;
    (node.children || []).forEach((c, i) => walk(c, depth + 1, depth === 0 ? i : top));
  };
  walk(root, 0, -1);
  return root;
}
Object.values(D.scenarios).forEach((s) => annotateTree(s.tree));

function treeRows(node, st, out = []) {
  const kids = node.children || [];
  const open = st.open.has(node.id);
  const revealed = node.kind === 'leaf' || node.depth === 0 ? (node.kind === 'leaf' || st.rootShown) : st.reveal.has(node.top);
  const state = revealed ? (node.kind === 'undefined' ? 'UNSAT' : node.state) : 'PENDING';
  const label = state === 'PENDING' ? 'pending' : (node.kind === 'undefined' ? 'not defined' : state);
  let name;
  if (node.kind === 'leaf') name = `<span class="nm">${esc(prettyLeaf(node.parts))}</span>`;
  else if (node.kind === 'def' || node.kind === 'undefined') name = `<span class="nm">${esc(node.name)}</span>`;
  else name = '<span class="nm" style="color:var(--muted)">subpolicy</span>';
  const opWord = node.op ? `<span class="op">${node.op === 'AND' ? 'AND · all of' : 'OR · any of'}</span>` : '';
  const optTag = node.optional ? '<span class="opt" title="Optional: does not block its parent">?</span>' : '';
  const cls = ['tr'];
  if (node.kind !== 'leaf' && node.kind !== 'op') cls.push('def');
  if (st.focus === node.top && node.depth === 1) cls.push('focus');
  if (st.mark && (st.mark.has(node.name) || st.mark.has(node.text))) cls.push('mark');
  out.push(`<div class="${cls.join(' ')}" style="padding-left:${8 + node.depth * 16}px" data-node="${node.id}">
    <button class="tw" data-tw="${node.id}" ${kids.length ? '' : 'disabled'} aria-label="${open ? 'Collapse' : 'Expand'}" aria-expanded="${open}">${kids.length ? (open ? '▼' : '▶') : ''}</button>
    ${name}${optTag}${opWord}<span class="spacer"></span>${pill(state, label)}</div>`);

/* Stepper: one button moves one sub-step; ports jump to a step; #step-N links open a step. */
(function () {
  const flat = [];
  STEPS.forEach((s, si) => s.subs.forEach((sub, k) => flat.push({ si, k, step: s, sub })));
  let pos = 0;

  const $ = (id) => document.getElementById(id);
  const startOf = (si) => flat.findIndex((f) => f.si === si);
  const hashFor = (si) => `step-${si + 1}`;
  const stepFromHash = () => {
    const m = /^#step-(\d+)$/.exec(location.hash || '');
    if (!m) return -1;
    const si = Number(m[1]) - 1;
    return si >= 0 && si < STEPS.length ? si : -1;
  };

  function buildRail() {
    const groups = [];
    STEPS.forEach((s, i) => {
      let g = groups.find((x) => x.name === s.group);
      if (!g) { g = { name: s.group, items: [] }; groups.push(g); }
      g.items.push([s, i]);
    });
    $('rail').innerHTML = groups.map((g) => `<div class="rail-group"><span class="rail-label">${esc(g.name)}</span><div class="ports">${g.items.map(([s, i]) =>
      `<button class="port" data-si="${i}" title="${esc(s.short)}" aria-label="Step ${i + 1}: ${esc(s.short)}"><span class="led"></span>${i + 1}</button>`).join('')}</div></div>`).join('') +
      '<div class="rail-title" id="rail-title"></div>';
    $('rail').addEventListener('click', (e) => {
      const b = e.target.closest('.port');
      if (b) go(startOf(Number(b.dataset.si)));
    });
  }

  function paintRail(f) {
    let furthest = pos;
    document.querySelectorAll('.port').forEach((b) => {
      const i = Number(b.dataset.si);
      b.classList.toggle('now', i === f.si);
      b.classList.toggle('done', i < f.si);
      if (i === f.si) {
        b.setAttribute('aria-current', 'step');
        const r = $('rail');
        const left = b.offsetLeft - r.offsetLeft;
        if (left < r.scrollLeft || left + b.offsetWidth > r.scrollLeft + r.clientWidth) r.scrollLeft = Math.max(0, left - 40);
      } else {
        b.removeAttribute('aria-current');
      }
    });
    $('rail-title').textContent = f.step.short;
    return furthest;
  }

  function nextLabel(i) {
    if (i >= flat.length - 1) return 'Start over';
    const f = flat[i];
    if (f.sub.next) return f.sub.next;
    return `Next: ${flat[i + 1].step.short}`;
  }

  function render(first) {
    const f = flat[pos];
    const subCount = f.step.subs.length;
    const part = (subCount > 1 ? ` · part ${f.k + 1} of ${subCount}` : '') + (f.step.sec ? ` · paper ${f.step.sec}` : '');
    $('narr').innerHTML = `<div class="eyebrow">Step ${f.si + 1} of ${STEPS.length}${part}</div><h1 id="step-title" tabindex="-1">${f.sub.h}</h1>${f.sub.p}` +
      (f.sub.board ? board(f.sub.board.reveal, f.sub.board.now) : '');
    $('exhibit').innerHTML = f.sub.x();
    if (!first) {
      $('narr').classList.remove('fade'); $('exhibit').classList.remove('fade');
      void $('narr').offsetWidth;
      $('narr').classList.add('fade'); $('exhibit').classList.add('fade');
    }
    $('narr').scrollTop = 0;
    $('exhibit').scrollTop = 0;
    wireBoard();
    if (f.sub.after) f.sub.after();
    // Bring highlighted lines into view inside their own code panel, never by scrolling the page.
    document.querySelectorAll('#exhibit .code').forEach((c) => {
      const hl = c.querySelector('.ln.hl');
      if (hl && c.scrollHeight > c.clientHeight) c.scrollTop = Math.max(0, hl.offsetTop - c.offsetTop - 28);
    });
    $('back').disabled = pos === 0;
    $('next-label').textContent = nextLabel(pos);
    $('pos').textContent = `${pos + 1} / ${flat.length}`;
    paintRail(f);
    if (!first && window.innerWidth < 1000) window.scrollTo({ top: 0 });
    try {
      const want = hashFor(f.si);
      if (location.hash !== `#${want}`) location.replace(`#${want}`);
    } catch (err) { /* The hash is only a convenience. */ }
  }

  function go(i) {
    pos = Math.max(0, Math.min(flat.length - 1, i));
    render(false);
  }
  const next = () => go(pos >= flat.length - 1 ? 0 : pos + 1);
  const back = () => go(pos - 1);

  buildRail();
  $('next').addEventListener('click', next);
  $('back').addEventListener('click', back);
  $('exhibit').addEventListener('click', (e) => {
    const g = e.target.closest('[data-go]');
    if (g) go(startOf(STEPS.findIndex((s) => s.id === g.dataset.go)));
  });
  $('exhibit').addEventListener('keydown', (e) => {
    const g = e.target.closest && e.target.closest('[data-go]');
    if (g && (e.key === 'Enter' || e.key === ' ')) {
      e.preventDefault();
      go(startOf(STEPS.findIndex((s) => s.id === g.dataset.go)));
    }
  });
  document.addEventListener('keydown', (e) => {
    if (e.metaKey || e.ctrlKey || e.altKey) return;
    const onControl = e.target.closest && e.target.closest('button, a, input, [data-go]');
    if (e.key === 'ArrowRight' || e.key === 'PageDown') { e.preventDefault(); next(); }
    else if (e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); back(); }
    else if (e.key === ' ' && !onControl) { e.preventDefault(); next(); }
    else if (e.key === 'Home') { e.preventDefault(); go(0); }
    else if (e.key === 'End') { e.preventDefault(); go(flat.length - 1); }
  });
  window.addEventListener('hashchange', () => {
    const si = stepFromHash();
    if (si >= 0 && flat[pos].si !== si) go(startOf(si));
  });
  const initial = stepFromHash();
  pos = initial >= 0 ? startOf(initial) : 0;
  render(true);
})();

</script>
</body>
</html>
